# Multiflux configuration — on m: /etc/multiflux/config.yaml (served at
# /mf/config.yaml, protected by LAN-or-Basic-auth). Edit and reload the page.
#
# Required:
url: https://rss.nahaboo.org
apiToken: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
# Optional (defaults shown):
# configPath: /etc/multiflux/config.yaml   # where this file lives on the
#                        # server — shown in the settings button tooltip
# theme: auto            # auto | light | dark
# oaMode: window         # how original articles open:
#                        #   window   = reuse a named "multiflux-oa" popup
#                        #              window, placed by oaGeometry (no
#                        #              browser decoration — browsers forbid
#                        #              scripting one)
#                        #   popdecor = same popup but requesting browser
#                        #              chrome (location/toolbar/menubar);
#                        #              works in Firefox only, Chrome keeps
#                        #              it undecorated
#                        #   tab      = open original articles in a new tab
# oaGeometry: right      # OA window placement (oaMode: window|popdecor):
#                        #   right        just right of the reader, same size
#                        #                (default)
#                        #   half         right half of the screen
#                        #   x,y,w,h      explicit pixels; x may be negative
#                        #                for a monitor left of the main one,
#                        #                e.g. 1920,0,1280,1024
# maxItems: 100          # entries fetched per feed (10..1000)
# refresh: 60            # auto-refresh interval in minutes (0 = off)
# autoReadTitleKeywords:
#   - trump
#   - elon musk
# keys:                  # rebind keyboard shortcuts (partial overrides ok);
#   nextItem: j,n        # see keys.example.yaml for every action + syntax;
#   toggleTheme: ctrl+alt+t   # invalid bindings abort startup with an error
